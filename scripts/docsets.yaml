# Curated documentation sources for `scripts/preload.py`.
#
# Each entry defines one docset and a list of canonical reference URLs.
# Selection rules:
#   - Server-rendered only (current scraper has no JS engine).
#   - Prefer concrete reference / function pages over chapter landing pages
#     (landing pages are mostly TOC links and produce poor retrieval).
#   - Aim for 4–8 URLs per docset.
#
# Sites that DO NOT WORK with the current scraper (all are SPAs):
#   - developer.android.com  → renders client-side, returns empty shells
#   - developer.apple.com    → same
#   - docs.swift.org/swift-book → DocC SPA; we use raw markdown from GitHub instead

docsets:

  python:
    urls:
      - https://docs.python.org/3/library/functions.html
      - https://docs.python.org/3/library/stdtypes.html
      - https://docs.python.org/3/library/asyncio-task.html
      - https://docs.python.org/3/library/typing.html
      - https://docs.python.org/3/tutorial/datastructures.html
      - https://docs.python.org/3/tutorial/classes.html

  javascript:
    urls:
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function
      - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators

  html:
    urls:
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/table
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/select
      - https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes

  java:
    urls:
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Optional.html
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Stream.html
      - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/CompletableFuture.html

  swift:
    # Raw markdown from the official swift-book repo (the rendered site at
    # docs.swift.org is a DocC SPA and not scrapable).
    urls:
      - https://raw.githubusercontent.com/swiftlang/swift-book/main/TSPL.docc/LanguageGuide/TheBasics.md
      - https://raw.githubusercontent.com/swiftlang/swift-book/main/TSPL.docc/LanguageGuide/ControlFlow.md
      - https://raw.githubusercontent.com/swiftlang/swift-book/main/TSPL.docc/LanguageGuide/Functions.md
      - https://raw.githubusercontent.com/swiftlang/swift-book/main/TSPL.docc/LanguageGuide/Closures.md
      - https://raw.githubusercontent.com/swiftlang/swift-book/main/TSPL.docc/LanguageGuide/Concurrency.md
      - https://raw.githubusercontent.com/swiftlang/swift-book/main/TSPL.docc/LanguageGuide/OptionalChaining.md

  php:
    urls:
      - https://www.php.net/manual/en/function.strpos.php
      - https://www.php.net/manual/en/function.preg-match.php
      - https://www.php.net/manual/en/function.array-map.php
      - https://www.php.net/manual/en/control-structures.foreach.php
      - https://www.php.net/manual/en/language.types.declarations.php
      - https://www.php.net/manual/en/language.operators.precedence.php
